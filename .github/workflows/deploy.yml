name: Build and manual Pages deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Pages (public repository, main branch only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build production assets
        run: npm run build
      # Ordinary pushes and private-repository checks never prepare a Pages artifact.
      - name: Upload Pages artifact
        if: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true &&
              github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true &&
          github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
